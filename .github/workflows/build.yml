name: Construire Camara AI

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Construire l'APK
        run: gradle assembleDebug --no-daemon
      - name: Publier l'APK pour le téléchargement direct
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CamaraAI.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk CamaraAI.apk --title "Camara AI pour Android" --notes "Touche CamaraAI.apk pour le télécharger, puis ouvre-le pour l'installer." --latest
